<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Roblox-style avatar: shield / counter-evolution warrior -->
  <!-- Head block -->
  <rect x="60" y="20" width="80" height="80" rx="6" fill="#1a1a2e" stroke="#b833ff" stroke-width="4"/>
  <!-- Helmet visor -->
  <rect x="72" y="42" width="56" height="20" rx="3" fill="#b833ff" opacity="0.2" stroke="#b833ff" stroke-width="1.5"/>
  <!-- Eyes (determined) -->
  <rect x="80" y="48" width="12" height="5" fill="#00fff5"/>
  <rect x="108" y="48" width="12" height="5" fill="#00fff5"/>
  <!-- Visor glint -->
  <line x1="72" y1="44" x2="88" y2="44" stroke="#b833ff" stroke-width="1" opacity="0.6"/>
  <!-- Brain glow inside head -->
  <circle cx="100" cy="36" r="8" fill="#b833ff" opacity="0.15"/>
  <circle cx="100" cy="36" r="4" fill="#b833ff" opacity="0.3"/>
  <!-- Body block (armored) -->
  <rect x="50" y="108" width="100" height="60" rx="4" fill="#1a1a2e" stroke="#b833ff" stroke-width="3"/>
  <!-- Shield on chest -->
  <path d="M88 118 L100 114 L112 118 L112 142 L100 150 L88 142Z" fill="none" stroke="#00fff5" stroke-width="2.5"/>
  <path d="M95 126 L100 124 L105 126 L105 136 L100 140 L95 136Z" fill="#00fff5" opacity="0.3"/>
  <!-- Protocol symbol -->
  <text x="96" y="135" font-family="monospace" font-size="10" font-weight="bold" fill="#00fff5">A</text>
  <!-- Arms (strong) -->
  <rect x="30" y="110" width="18" height="55" rx="4" fill="#1a1a2e" stroke="#b833ff" stroke-width="2.5"/>
  <rect x="152" y="110" width="18" height="55" rx="4" fill="#1a1a2e" stroke="#b833ff" stroke-width="2.5"/>
  <!-- Fists -->
  <rect x="32" y="162" width="14" height="14" rx="3" fill="#b833ff" opacity="0.4" stroke="#b833ff" stroke-width="1.5"/>
  <rect x="154" y="162" width="14" height="14" rx="3" fill="#b833ff" opacity="0.4" stroke="#b833ff" stroke-width="1.5"/>
  <!-- Legs -->
  <rect x="62" y="172" width="26" height="22" rx="3" fill="#1a1a2e" stroke="#b833ff" stroke-width="2"/>
  <rect x="112" y="172" width="26" height="22" rx="3" fill="#1a1a2e" stroke="#b833ff" stroke-width="2"/>
</svg>
