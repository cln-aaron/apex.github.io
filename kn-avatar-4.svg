<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Roblox-style avatar: unlocked/leveled up -->
  <!-- Head block -->
  <rect x="60" y="20" width="80" height="80" rx="6" fill="#1a1a2e" stroke="#ff6b35" stroke-width="4"/>
  <!-- Crown / level up indicator -->
  <polygon points="80,18 90,8 100,16 110,8 120,18" fill="none" stroke="#ff6b35" stroke-width="2.5"/>
  <!-- Eyes (confident) -->
  <rect x="78" y="50" width="14" height="6" rx="1" fill="#ff6b35"/>
  <rect x="108" y="50" width="14" height="6" rx="1" fill="#ff6b35"/>
  <!-- Smile -->
  <path d="M88 68 Q100 78 112 68" fill="none" stroke="#ff6b35" stroke-width="2" stroke-linecap="round"/>
  <!-- Lock icon (unlocked) -->
  <rect x="90" y="32" width="20" height="14" rx="2" fill="none" stroke="#39ff14" stroke-width="2"/>
  <path d="M96 32 L96 26 Q96 22 100 22 Q104 22 104 26 L104 28" fill="none" stroke="#39ff14" stroke-width="2"/>
  <!-- Body block -->
  <rect x="50" y="108" width="100" height="60" rx="4" fill="#1a1a2e" stroke="#ff6b35" stroke-width="3"/>
  <!-- Trophy / certificate on chest -->
  <rect x="82" y="120" width="36" height="28" rx="2" fill="none" stroke="#ff6b35" stroke-width="2"/>
  <line x1="88" y1="128" x2="112" y2="128" stroke="#ff6b35" stroke-width="1.5" opacity="0.6"/>
  <line x1="88" y1="134" x2="108" y2="134" stroke="#ff6b35" stroke-width="1.5" opacity="0.6"/>
  <line x1="88" y1="140" x2="104" y2="140" stroke="#ff6b35" stroke-width="1.5" opacity="0.6"/>
  <!-- Star badge -->
  <polygon points="100,112 103,118 110,118 105,122 107,128 100,125 93,128 95,122 90,118 97,118" fill="#ff6b35" opacity="0.8"/>
  <!-- Arms (raised celebration) -->
  <rect x="28" y="96" width="16" height="55" rx="3" fill="#1a1a2e" stroke="#ff6b35" stroke-width="2" transform="rotate(-20 36 123)"/>
  <rect x="156" y="96" width="16" height="55" rx="3" fill="#1a1a2e" stroke="#ff6b35" stroke-width="2" transform="rotate(20 164 123)"/>
  <!-- Legs -->
  <rect x="62" y="172" width="26" height="22" rx="3" fill="#1a1a2e" stroke="#ff6b35" stroke-width="2"/>
  <rect x="112" y="172" width="26" height="22" rx="3" fill="#1a1a2e" stroke="#ff6b35" stroke-width="2"/>
  <!-- Sparkles -->
  <circle cx="42" cy="90" r="3" fill="#ff6b35" opacity="0.6"/>
  <circle cx="158" cy="88" r="3" fill="#ff6b35" opacity="0.6"/>
  <circle cx="48" cy="78" r="2" fill="#39ff14" opacity="0.5"/>
  <circle cx="152" cy="76" r="2" fill="#39ff14" opacity="0.5"/>
</svg>
