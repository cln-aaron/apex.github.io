<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Roblox-style avatar: under construction / building brain -->
  <!-- Head block with construction lines -->
  <rect x="60" y="20" width="80" height="80" rx="6" fill="#1a1a2e" stroke="#39ff14" stroke-width="4"/>
  <!-- Scaffolding on head -->
  <line x1="55" y1="25" x2="55" y2="95" stroke="#39ff14" stroke-width="2" opacity="0.5"/>
  <line x1="145" y1="25" x2="145" y2="95" stroke="#39ff14" stroke-width="2" opacity="0.5"/>
  <line x1="55" y1="45" x2="65" y2="45" stroke="#39ff14" stroke-width="2" opacity="0.5"/>
  <line x1="135" y1="45" x2="145" y2="45" stroke="#39ff14" stroke-width="2" opacity="0.5"/>
  <line x1="55" y1="75" x2="65" y2="75" stroke="#39ff14" stroke-width="2" opacity="0.5"/>
  <line x1="135" y1="75" x2="145" y2="75" stroke="#39ff14" stroke-width="2" opacity="0.5"/>
  <!-- Half-built brain -->
  <path d="M85 42 C75 38 72 48 75 55 C70 57 68 65 78 68" fill="none" stroke="#00fff5" stroke-width="2.5"/>
  <path d="M102 42 C112 38 118 48 115 55 C120 57 122 65 112 68" fill="none" stroke="#00fff5" stroke-width="2.5" stroke-dasharray="6 4"/>
  <!-- Construction progress bar -->
  <rect x="72" y="78" width="56" height="6" rx="2" fill="none" stroke="#39ff14" stroke-width="1.5"/>
  <rect x="73" y="79" width="30" height="4" rx="1" fill="#39ff14" opacity="0.8"/>
  <text x="132" y="84" font-family="monospace" font-size="8" fill="#39ff14">58%</text>
  <!-- Eyes (alert) -->
  <rect x="80" y="52" width="10" height="6" fill="#39ff14"/>
  <rect x="104" y="52" width="10" height="6" fill="#39ff14"/>
  <!-- Body block -->
  <rect x="55" y="108" width="90" height="60" rx="4" fill="#1a1a2e" stroke="#39ff14" stroke-width="3"/>
  <!-- Wrench icon on chest -->
  <circle cx="100" cy="135" r="10" fill="none" stroke="#39ff14" stroke-width="2"/>
  <line x1="100" y1="125" x2="100" y2="135" stroke="#39ff14" stroke-width="2"/>
  <line x1="95" y1="130" x2="105" y2="140" stroke="#39ff14" stroke-width="2"/>
  <!-- Arms -->
  <rect x="35" y="112" width="16" height="50" rx="3" fill="#1a1a2e" stroke="#39ff14" stroke-width="2"/>
  <rect x="149" y="112" width="16" height="50" rx="3" fill="#1a1a2e" stroke="#39ff14" stroke-width="2"/>
  <!-- Legs -->
  <rect x="65" y="172" width="24" height="20" rx="3" fill="#1a1a2e" stroke="#39ff14" stroke-width="2"/>
  <rect x="111" y="172" width="24" height="20" rx="3" fill="#1a1a2e" stroke="#39ff14" stroke-width="2"/>
</svg>
